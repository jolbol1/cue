name: Release

# Every push to main that changes the app publishes a new version.
# Versions bump the patch number by default; put #minor or #major in a commit
# message to bump those instead, or run this workflow manually to choose.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "scripts/build.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Cue uses macOS 26 APIs and needs the macOS 26 SDK (Xcode 26) to build.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Test
        run: ./scripts/test.sh

      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            bump=${BUMP:-patch}
            if [[ -z "$BUMP" ]]; then
              log=$(git log --format=%B "$latest"..HEAD)
              if grep -q '#major' <<< "$log"; then bump=major
              elif grep -q '#minor' <<< "$log"; then bump=minor
              fi
            fi
            case $bump in
              major) next=$((major + 1)).0.0 ;;
              minor) next=$major.$((minor + 1)).0 ;;
              *) next=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CUE_UNIVERSAL: "1"
          CUE_VERSION: ${{ steps.version.outputs.version }}
          CUE_BUILD: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent dist/Cue.app "Cue-$VERSION.zip"
          shasum -a 256 "Cue-$VERSION.zip" | tee "Cue-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **Cue-VERSION.zip** below and unzip it.
          2. Move **Cue.app** to your Applications folder.
          3. Cue isn't notarized, so the first time you open it, macOS will block it. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. Alternatively, run:
             ```sh
             xattr -dr com.apple.quarantine /Applications/Cue.app
             ```

          Requires macOS 14 or later. Runs natively on Apple silicon and Intel Macs. After updating, you may need to turn Cue's **Input Monitoring** permission off and on again for the Stream Deck Pedal.
          EOF
          sed -i '' "s/VERSION/$VERSION/" notes.md
          gh release create "v$VERSION" "Cue-$VERSION.zip" "Cue-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Cue $VERSION" \
            --notes-file notes.md \
            --generate-notes
